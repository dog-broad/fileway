<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fileway — Any file. Any format. One way.</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/prism-theme.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Fileway.Client.styles.css" rel="stylesheet" />
    <!-- ThemeInterop must run before Blazor to prevent flash of unstyled content -->
    <script src="js/ThemeInterop.js"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/prism.min.js"></script>
    <script src="js/SseClient.js"></script>
    <script src="js/ClientInterop.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
